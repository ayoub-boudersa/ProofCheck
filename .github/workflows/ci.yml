  
  
      # Note: this CI run is stateless — guesses.jsonl and outcomes.jsonl don't
      # persist between runs on GitHub's disposable machines. That's expected:
      # this tool is designed to run on a persistent local machine (see README),
      # where guess history accumulates permanently across real runs. This
      # workflow exists to prove the pipeline works end-to-end on every push,
      # not to build long-term history.


name: Triage Tool CI

on:
  push:
    branches: [main]

jobs:
  test-and-classify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests and generate CTRF report
        run: pytest --ctrf report.json
        continue-on-error: true

      - name: Classify failures
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python classify.py